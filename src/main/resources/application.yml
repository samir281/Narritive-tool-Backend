spring:
  datasource:
    # Local default: a file-based H2 database (no install needed).
    # In production set DATABASE_URL to a free PostgreSQL, e.g. jdbc:postgresql://HOST/DB?sslmode=require
    url: ${DATABASE_URL:jdbc:h2:file:./data/newsdb;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}   # Supabase's pooler and small servers both like few connections
  jpa:
    hibernate:
      ddl-auto: update          # creates/updates tables automatically; move to Flyway later if you want migrations
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  jackson:
    default-property-inclusion: always

server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  base-url: ${APP_BASE_URL:http://localhost:5173}     # the website (frontend) address, used in share links
  cors-origins: ${CORS_ORIGINS:http://localhost:5173} # comma-separated website addresses allowed to call this API
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
    admin-ttl-minutes: 480
    reader-ttl-minutes: 43200                          # 30 days
  bootstrap:
    admin-email: ${ADMIN_EMAIL:admin@news.local}
    admin-password: ${ADMIN_PASSWORD:ChangeMe123!}
  render:
    thumb-width: 480                                   # all-pages grid
    small-width: 1300                                  # normal reading view
    large-width: 2600                                  # zoom view; scanned papers are usually ~2600 px wide, more adds no detail
    jpeg-quality: 0.85
    max-pages: 60
  ocr:                                                 # reads the page text after upload (text view + tap-a-story)
    enabled: ${OCR_ENABLED:true}
    datapath: ${TESSDATA_PATH:./tessdata}              # folder with hin.traineddata and eng.traineddata
    languages: hin+eng
