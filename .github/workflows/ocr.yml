# Reads the text of newly uploaded pages (Text view / tap-a-story) on GitHub's free runners, because the
# free web server has too little memory for OCR. Writes straight to the shared database, then exits.
# Needs the repository secret DB_PASSWORD (Settings → Secrets and variables → Actions).
name: Read page text

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: ocr
  cancel-in-progress: false

jobs:
  ocr:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install the OCR engine and language files
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libtesseract5
          sudo ln -sf "$(find /usr/lib -name 'libtesseract.so.5' | head -n1)" /usr/lib/libtesseract.so
          mkdir -p tessdata
          curl -sSL -o tessdata/hin.traineddata https://github.com/tesseract-ocr/tessdata/raw/main/hin.traineddata
          curl -sSL -o tessdata/eng.traineddata https://github.com/tesseract-ocr/tessdata/raw/main/eng.traineddata
      - name: Build
        run: mvn -q -B -DskipTests package
      - name: Read pages that have no text yet
        env:
          DATABASE_URL: jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require
          DB_USER: postgres.vuwjzavtizoxqyuccorj
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          OCR_ENABLED: 'true'
          TESSDATA_PATH: ./tessdata
        run: >
          java -jar target/narrative-news-1.0.0.jar
          --app.ocr.worker-run=true
          --server.port=0
          --spring.jpa.hibernate.ddl-auto=none
